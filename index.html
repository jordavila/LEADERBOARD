<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TOP FRAGERS</title>
  <link rel="stylesheet" href="style.css?v=20261023-3" />
</head>
<body>
  <h2>KILL COUNTER</h2>
  <div class="toolbar">
    <button id="export-image-btn" class="export-btn" type="button">Exportar imagen</button>
    <a id="source-sheet-link" class="source-btn" target="_blank" rel="noopener noreferrer">Abrir Google Sheets ↗</a>
  </div>

  <section class="hero" aria-label="Clasificación del equipo">
    <aside id="captain" class="captain" aria-label="Mejores jugadores" hidden></aside>
    <div id="leaderboard" class="leaderboard"></div>
  </section>

  <section class="panel-block">
    <h2 class="section-title">Dashboard</h2>
    <div id="dashboard" class="dashboard-grid"></div>
  </section>

  <section id="summary-table" class="panel-block"></section>
  <section id="heatmap" class="panel-block"></section>

  <section class="panel-block">
    <h2 class="section-title">Gráficas</h2>
    <div class="charts-grid">
      <div class="chart-card chart-wide"><h3>Posición del equipo por partida</h3><p class="chart-note">Más cerca de 1, mejor. Se omiten los resultados vacíos.</p><canvas id="chart-position" role="img" aria-label="Posición del equipo en cada partida"></canvas><p id="position-empty" class="empty-note" hidden>Sin posiciones registradas.</p></div>
      <div class="chart-card"><h3>Evolución de Kills por Jugador</h3><canvas id="chart-trend"></canvas></div>
      <div class="chart-card"><h3>Kills Acumuladas por Jugador</h3><canvas id="chart-cumulative"></canvas></div>
      <div class="chart-card"><h3>Kills Promedio por Jugador</h3><canvas id="chart-avg-kills"></canvas></div>
      <div class="chart-card"><h3>Partidas Lideradas por Jugador</h3><canvas id="chart-led"></canvas></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="script.js?v=20261023-3"></script>
</body>
</html>
